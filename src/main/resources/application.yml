spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:oracle:thin:@//localhost:1522/FREEPDB1
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: 8080
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 30
  admin:
    email: admin@gros.ma
    password: ${ADMIN_PASSWORD}
  blocage-auto:
    cron: "0 0 2 * * *"