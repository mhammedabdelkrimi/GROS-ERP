services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: gros-oracle
    ports:
      - "1522:1521"      # PC:conteneur. 1522 évite le conflit avec ton Oracle Windows
    environment:
      ORACLE_PASSWORD: admin123
      APP_USER: gros
      APP_USER_PASSWORD: gros123
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      retries: 30

  api:
    build: .
    container_name: gros-api
    depends_on:
      oracle:
        condition: service_healthy     # attend qu'Oracle soit prêt
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: gros
      SPRING_DATASOURCE_PASSWORD: gros123
    ports:
      - "8080:8080"

volumes:
  oracle-data: