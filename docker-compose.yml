services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: gros-oracle
    ports:
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:?Définir ORACLE_ADMIN_PASSWORD dans .env}
      APP_USER: ${DB_USER:?Définir DB_USER dans .env}
      APP_USER_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      retries: 30

  api:
    build: .
    container_name: gros-api
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Définir JWT_SECRET dans .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Définir ADMIN_PASSWORD dans .env}
    ports:
      - "8080:8080"

volumes:
  oracle-data: