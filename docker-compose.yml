services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: gros-oracle
    ports:
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: admin123
      APP_USER: gros
      APP_USER_PASSWORD: gros123
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      retries: 30

volumes:
  oracle-data: